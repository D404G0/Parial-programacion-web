services:
  # Backend Python Flask API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecoeat_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PORT=5000
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/ingredientes/sugeridos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - ecoeat_network

  # Frontend Flutter Web UI Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.multistage
    container_name: ecoeat_frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ecoeat_network

networks:
  ecoeat_network:
    driver: bridge
